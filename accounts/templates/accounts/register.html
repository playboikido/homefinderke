{% extends 'base.html' %}

{% block title %}
Register
{% endblock %}

{% block content %}

<h2>Create Account</h2>

<p>
Join HomeFinder KE and help others find homes.
</p>

<form method="POST" action="{% if next_url %}?next={{ next_url }}{% endif %}">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Register
    </button>

</form>

{% endblock %}
