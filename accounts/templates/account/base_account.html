{% extends "base.html" %}

{% block content %}

<style>

:root{
--primary:#2563eb;
--secondary:#1d4ed8;
--accent:#38bdf8;
--light:#f8fafc;
--dark:#0f172a;
--gray:#64748b;
}
[data-theme="dark"] {
    --c-primary:     #14B8A6;
    --c-primary-dk:  #0F766E;
    --c-secondary:   #2DD4BF;
    --c-accent:      #38BDF8;
    --c-bg:          #0F172A;
    --c-fg:          #E2E8F0;
    --c-surface:     #1E293B;
    --c-muted:       #334155;
    --c-border:      #334155;
    --c-text:        #CBD5E1;
    --c-subtle:      #94A3B8;
    --c-danger:      #F87171;
    --c-gold:        #FBBF24;
    --c-gold-bg:     #422006;
    --c-green-bg:    #052E1C;
    --c-green-text: #4ADE80;
    --c-pending-bg:  #422006;
    --c-pending-txt: #FBBF24;
  }

.account-wrapper{

min-height:85vh;
display:flex;
justify-content:center;
align-items:center;
padding:60px 20px;

background:
linear-gradient(135deg,#eff6ff,#ffffff);

}

.account-card{

width:100%;
max-width:560px;

background:white;

border-radius:20px;

padding:45px;

box-shadow:0 20px 45px rgba(0,0,0,.08);

border:1px solid rgba(37,99,235,.08);

}

.account-card h1{

font-size:2rem;

margin-bottom:18px;

color:var(--dark);

}

.account-card p{

color:var(--gray);

line-height:1.8;

}

.btn-primary{

display:inline-block;

padding:14px 30px;

background:var(--primary);

color:white;

text-decoration:none;

border-radius:10px;

font-weight:600;

transition:.3s;

}

.btn-primary:hover{

background:var(--secondary);

transform:translateY(-2px);

}

@media(max-width:600px){

.account-card{

padding:28px;

}

.account-card h1{

font-size:1.6rem;

}

}

</style>

<div class="account-wrapper">

<div class="account-card">

{% block account_content %}

{% endblock %}

</div>

</div>

{% endblock %}
