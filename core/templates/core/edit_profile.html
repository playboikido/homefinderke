{% extends 'base.html' %}

{% block title %}Edit Profile — HomeFinder Kenya{% endblock %}

{% block content %}

<style>
  /* ── Google Fonts ─────────────────────────────────────────── */
  @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap');

  /* ── Design Tokens (matches dashboard) ───────────────────────── */
  :root {
    --c-primary:     #0F766E;
    --c-primary-dk:  #0D5E58;
    --c-secondary:   #14B8A6;
    --c-accent:      #0369A1;
    --c-bg:          #F0FDFA;
    --c-fg:          #134E4A;
    --c-surface:     #FFFFFF;
    --c-muted:       #E8F0F3;
    --c-border:      #99F6E4;
    --c-text:        #1C4A47;
    --c-subtle:      #5EAFA8;

    --font-body:     'Fira Sans', system-ui, sans-serif;
    --font-mono:     'Fira Code', monospace;

    --r:      12px;
    --r-lg:   18px;
    --r-xl:   24px;
    --r-full: 9999px;

    --shadow:    0 4px 12px rgba(15,118,110,0.10), 0 2px 4px rgba(15,118,110,0.05);
    --shadow-lg: 0 12px 32px rgba(15,118,110,0.14), 0 4px 8px rgba(15,118,110,0.06);
    --ease: cubic-bezier(0.4,0,0.2,1);
  
  }
  [data-theme="dark"] {
    --c-primary:     #14B8A6;
    --c-primary-dk:  #0F766E;
    --c-secondary:   #2DD4BF;
    --c-accent:      #38BDF8;
    --c-bg:          #0F172A;
    --c-fg:          #E2E8F0;
    --c-surface:     #1E293B;
    --c-muted:       #334155;
    --c-border:      #334155;
    --c-text:        #CBD5E1;
    --c-subtle:      #94A3B8;
    --c-danger:      #F87171;
    --c-gold:        #FBBF24;
    --c-gold-bg:     #422006;
    --c-green-bg:    #052E1C;
    --c-green-text: #4ADE80;
    --c-pending-bg:  #422006;
    --c-pending-txt: #FBBF24;
  }

  /* ── Scope ──────────────────────────────────────────────────── */
  .ep-wrap {
    font-family: var(--font-body);
    background: var(--c-bg);
    min-height: 100vh;
    color: var(--c-text);
    -webkit-font-smoothing: antialiased;
  }

  .ep-inner {
    max-width: 560px;
    margin: 0 auto;
    padding: 0 24px 64px;
  }

  /* ── Hero ─────────────────────────────────────────────────────── */
  .ep-hero {
    background: linear-gradient(135deg, var(--c-fg) 0%, var(--c-primary) 60%, var(--c-secondary) 100%);
    padding: 48px 24px 56px;
    position: relative;
    overflow: hidden;
    text-align: center;
  }
  .ep-hero::before {
    content: '';
    position: absolute;
    width: 500px; height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(20,184,166,.18), transparent 65%);
    top: -190px; right: -140px;
    pointer-events: none;
  }
  .ep-hero-inner {
    max-width: 560px;
    margin: 0 auto;
    position: relative;
  }
  .ep-hero-icon {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: 1.5px solid rgba(255,255,255,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
    color: #FFFFFF;
  }
  .ep-hero-icon svg { width: 26px; height: 26px; }
  .ep-hero-eyebrow {
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--c-secondary);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 8px;
    font-family: var(--font-mono);
  }
  .ep-hero-title {
    font-family: var(--font-mono);
    font-size: clamp(1.5rem, 3.5vw, 2rem);
    font-weight: 700;
    color: #FFFFFF;
    line-height: 1.2;
  }

  /* ── Card ─────────────────────────────────────────────────────── */
  .ep-section {
    margin-top: -28px;
    position: relative;
    z-index: 10;
  }
  .ep-card {
    background: var(--c-surface);
    border-radius: var(--r-xl);
    padding: 32px 32px 28px;
    box-shadow: var(--shadow);
    border: 1px solid rgba(153,246,228,0.4);
  }

  .ep-card form p { margin: 0 0 20px; }
  .ep-card form p:last-of-type { margin-bottom: 24px; }

  .ep-card form label {
    display: block;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--c-fg);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 7px;
  }

  .ep-card form input[type="text"],
  .ep-card form input[type="email"],
  .ep-card form input[type="tel"],
  .ep-card form input[type="number"],
  .ep-card form input[type="password"],
  .ep-card form textarea,
  .ep-card form select {
    width: 100%;
    font-family: var(--font-body);
    font-size: 0.9rem;
    color: var(--c-text);
    background: var(--c-bg);
    border: 1.5px solid var(--c-border);
    border-radius: var(--r);
    padding: 11px 14px;
    transition: border-color 180ms var(--ease), box-shadow 180ms var(--ease);
    box-sizing: border-box;
  }
  .ep-card form textarea {
    min-height: 100px;
    resize: vertical;
  }
  .ep-card form input:focus,
  .ep-card form textarea:focus,
  .ep-card form select:focus {
    outline: none;
    border-color: var(--c-primary);
    box-shadow: 0 0 0 3px rgba(15,118,110,0.12);
  }

  /* File inputs (e.g. profile photo upload) */
  .ep-card form input[type="file"] {
    width: 100%;
    font-family: var(--font-body);
    font-size: 0.84rem;
    color: var(--c-subtle);
    background: var(--c-muted);
    border: 1.5px dashed var(--c-border);
    border-radius: var(--r);
    padding: 14px;
    cursor: pointer;
    box-sizing: border-box;
    transition: border-color 180ms var(--ease), background 180ms var(--ease);
  }
  .ep-card form input[type="file"]:hover {
    border-color: var(--c-primary);
    background: #CCFBF1;
  }

  /* Checkbox rows (e.g. notification prefs) */
  .ep-card form ul {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .ep-card form input[type="checkbox"],
  .ep-card form input[type="radio"] {
    width: 16px; height: 16px;
    accent-color: var(--c-primary);
    cursor: pointer;
    margin-right: 8px;
  }

  .ep-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 13px 26px;
    border-radius: var(--r);
    font-size: 0.9rem;
    font-weight: 600;
    font-family: var(--font-body);
    border: none;
    cursor: pointer;
    background: var(--c-primary);
    color: #FFFFFF;
    transition: all 200ms var(--ease);
  }
  .ep-btn:hover {
    background: var(--c-primary-dk);
    transform: translateY(-1px);
    box-shadow: var(--shadow);
  }

  @media (max-width: 600px) {
    .ep-card { padding: 26px 22px 22px; }
    .ep-hero { padding: 40px 20px 48px; }
  }
</style>

<div class="ep-wrap">

  <!-- Hero -->
  <div class="ep-hero">
    <div class="ep-hero-inner">
      <div class="ep-hero-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      </div>
      <div class="ep-hero-eyebrow">Your Account</div>
      <h1 class="ep-hero-title">Edit Profile</h1>
    </div>
  </div>

  <div class="ep-inner">
    <div class="ep-section">

      <div class="ep-card">
        <form method="POST" enctype="multipart/form-data">
          {% csrf_token %}
          {{ form.as_p }}

          <button type="submit" class="ep-btn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
            Save Profile
          </button>
        </form>
      </div>

    </div><!-- /.ep-section -->
  </div><!-- /.ep-inner -->
</div><!-- /.ep-wrap -->

{% endblock %}
