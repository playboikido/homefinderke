{% extends 'base.html' %}

{% block title %}Review {{ residence.name }} — HomeFinder Kenya{% endblock %}

{% block content %}

<style>
  /* ── Google Fonts ─────────────────────────────────────────── */
  @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Fira+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap');

  /* ── Design Tokens (matches dashboard) ───────────────────────── */
  :root {
    --c-primary:     #0F766E;
    --c-primary-dk:  #0D5E58;
    --c-secondary:   #14B8A6;
    --c-accent:      #0369A1;
    --c-bg:          #F0FDFA;
    --c-fg:          #134E4A;
    --c-surface:     #FFFFFF;
    --c-muted:       #E8F0F3;
    --c-border:      #99F6E4;
    --c-text:        #1C4A47;
    --c-subtle:      #5EAFA8;
    --c-gold:        #D97706;
    --c-gold-bg:     #FEF3C7;

    --font-body:     'Fira Sans', system-ui, sans-serif;
    --font-mono:     'Fira Code', monospace;

    --r:      12px;
    --r-lg:   18px;
    --r-xl:   24px;
    --r-full: 9999px;

    --shadow:    0 4px 12px rgba(15,118,110,0.10), 0 2px 4px rgba(15,118,110,0.05);
    --shadow-lg: 0 12px 32px rgba(15,118,110,0.14), 0 4px 8px rgba(15,118,110,0.06);
    --ease: cubic-bezier(0.4,0,0.2,1);
  }

  /* ── Scope ──────────────────────────────────────────────────── */
  .rv-wrap {
    font-family: var(--font-body);
    background: var(--c-bg);
    min-height: 100vh;
    color: var(--c-text);
    -webkit-font-smoothing: antialiased;
  }

  .rv-inner {
    max-width: 560px;
    margin: 0 auto;
    padding: 0 24px 64px;
  }

  /* ── Hero ─────────────────────────────────────────────────────── */
  .rv-hero {
    background: linear-gradient(135deg, var(--c-fg) 0%, var(--c-primary) 60%, var(--c-secondary) 100%);
    padding: 48px 24px 56px;
    position: relative;
    overflow: hidden;
    text-align: center;
  }
  .rv-hero::before {
    content: '';
    position: absolute;
    width: 500px; height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(20,184,166,.18), transparent 65%);
    top: -190px; right: -140px;
    pointer-events: none;
  }
  .rv-hero-inner {
    max-width: 560px;
    margin: 0 auto;
    position: relative;
  }
  .rv-hero-icon {
    width: 52px; height: 52px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: 1.5px solid rgba(255,255,255,0.25);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 16px;
    color: var(--c-gold);
  }
  .rv-hero-icon svg { width: 26px; height: 26px; }
  .rv-hero-eyebrow {
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--c-secondary);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 8px;
    font-family: var(--font-mono);
  }
  .rv-hero-title {
    font-family: var(--font-mono);
    font-size: clamp(1.4rem, 3.5vw, 1.9rem);
    font-weight: 700;
    color: #FFFFFF;
    line-height: 1.25;
  }

  /* ── Card ─────────────────────────────────────────────────────── */
  .rv-section {
    margin-top: -28px;
    position: relative;
    z-index: 10;
  }
  .rv-card {
    background: var(--c-surface);
    border-radius: var(--r-xl);
    padding: 32px 32px 28px;
    box-shadow: var(--shadow);
    border: 1px solid rgba(153,246,228,0.4);
  }

  .rv-card form p { margin: 0 0 20px; }
  .rv-card form p:last-of-type { margin-bottom: 24px; }

  .rv-card form label {
    display: block;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--c-fg);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 7px;
  }

  .rv-card form input[type="text"],
  .rv-card form input[type="number"],
  .rv-card form textarea,
  .rv-card form select {
    width: 100%;
    font-family: var(--font-body);
    font-size: 0.9rem;
    color: var(--c-text);
    background: var(--c-bg);
    border: 1.5px solid var(--c-border);
    border-radius: var(--r);
    padding: 11px 14px;
    transition: border-color 180ms var(--ease), box-shadow 180ms var(--ease);
    box-sizing: border-box;
  }
  .rv-card form textarea {
    min-height: 120px;
    resize: vertical;
  }
  .rv-card form input:focus,
  .rv-card form textarea:focus,
  .rv-card form select:focus {
    outline: none;
    border-color: var(--c-primary);
    box-shadow: 0 0 0 3px rgba(15,118,110,0.12);
  }

  /* Star-style radio widgets (Django often renders rating as radio/select) */
  .rv-card form ul {
    list-style: none;
    display: flex;
    gap: 6px;
    padding: 0;
    margin: 0;
  }
  .rv-card form ul li {
    display: flex;
    align-items: center;
  }
  .rv-card form ul li label {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 8px 12px;
    background: var(--c-gold-bg);
    border: 1.5px solid transparent;
    border-radius: var(--r-full);
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--c-gold);
    text-transform: none;
    letter-spacing: 0;
    cursor: pointer;
    margin: 0;
  }
  .rv-card form ul li input[type="radio"] {
    accent-color: var(--c-gold);
    cursor: pointer;
  }

  .rv-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 13px 26px;
    border-radius: var(--r);
    font-size: 0.9rem;
    font-weight: 600;
    font-family: var(--font-body);
    border: none;
    cursor: pointer;
    background: var(--c-primary);
    color: #FFFFFF;
    transition: all 200ms var(--ease);
  }
  .rv-btn:hover {
    background: var(--c-primary-dk);
    transform: translateY(-1px);
    box-shadow: var(--shadow);
  }

  @media (max-width: 600px) {
    .rv-card { padding: 26px 22px 22px; }
    .rv-hero { padding: 40px 20px 48px; }
  }
</style>

<div class="rv-wrap">

  <!-- Hero -->
  <div class="rv-hero">
    <div class="rv-hero-inner">
      <div class="rv-hero-icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
      </div>
      <div class="rv-hero-eyebrow">Share Your Experience</div>
      <h1 class="rv-hero-title">Review {{ residence.name }}</h1>
    </div>
  </div>

  <div class="rv-inner">
    <div class="rv-section">

      <div class="rv-card">
        <form method="POST">
          {% csrf_token %}
          {{ form.as_p }}

          <button type="submit" class="rv-btn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            Submit Review
          </button>
        </form>
      </div>

    </div><!-- /.rv-section -->
  </div><!-- /.rv-inner -->
</div><!-- /.rv-wrap -->

{% endblock %}
