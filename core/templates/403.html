{% extends "base.html" %}
{% block title %}403 - Forbidden | HomeFinder{% endblock %}

{% block content %}

<style>

.error-container{
min-height:80vh;
display:flex;
justify-content:center;
align-items:center;
padding:40px;
}

.error-card{
max-width:650px;
background:white;
padding:50px;
border-radius:18px;
box-shadow:0 15px 40px rgba(0,0,0,.08);
text-align:center;
}

.error-code{
font-size:80px;
font-weight:bold;
color:#f59e0b;
margin-bottom:10px;
}

.btn{
background:#2563eb;
color:white;
padding:14px 30px;
border-radius:10px;
text-decoration:none;
display:inline-block;
margin-top:20px;
}

.btn:hover{
background:#1d4ed8;
}

</style>

<div class="error-container">
<div class="error-card">

<div class="error-code">
403
</div>

<h1>Access Forbidden</h1>

<p>
You don't have permission to access this page.

If you believe this is an error, please contact HomeFinder support.
</p>

<a href="{% url 'home' %}" class="btn">
🏠 Return Home
</a>

</div>
</div>

{% endblock %}
