{% extends "base.html" %}
{% block title %}400 - Bad Request | HomeFinder{% endblock %}

{% block content %}

<style>

.error-container{
min-height:80vh;
display:flex;
justify-content:center;
align-items:center;
padding:40px;
}

.error-card{
max-width:650px;
width:100%;
background:#fff;
padding:50px;
border-radius:18px;
box-shadow:0 15px 40px rgba(0,0,0,.08);
text-align:center;
}

.error-code{
font-size:80px;
font-weight:700;
color:#2563eb;
margin-bottom:10px;
}

.error-card h1{
color:#0f172a;
margin-bottom:15px;
}

.error-card p{
color:#64748b;
line-height:1.8;
margin-bottom:30px;
}

.btn-home{
background:#2563eb;
color:#fff;
padding:14px 30px;
border-radius:10px;
text-decoration:none;
font-weight:600;
}

.btn-home:hover{
background:#1d4ed8;
}

</style>

<div class="error-container">
<div class="error-card">

<div class="error-code">400</div>

<h1>Bad Request</h1>

<p>
The request could not be processed.
Please check your information and try again.
</p>

<a href="{% url 'home' %}" class="btn-home">
🏠 Return Home
</a>

</div>
</div>

{% endblock %}
