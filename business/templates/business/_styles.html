<style>
    .biz-wrap { max-width:760px; margin:0 auto; padding:32px 20px 60px; }
    .biz-wrap.biz-wide { max-width:1080px; }

    .biz-topbar {
        text-align:center; color:var(--primary); font-weight:700; font-size:0.85rem;
        margin-bottom:20px; font-family:var(--font-mono); text-transform:uppercase; letter-spacing:0.06em;
    }
    .biz-back-link { margin-bottom:16px; }
    .biz-back-link a { color:var(--primary); text-decoration:none; font-size:0.85rem; font-weight:600; }
    .biz-back-link a:hover { text-decoration:underline; }

    .biz-progress { display:flex; gap:6px; margin-bottom:28px; }
    .biz-progress span { flex:1; height:6px; border-radius:var(--radius-full); background:var(--muted); }
    .biz-progress span.done, .biz-progress span.active { background:var(--primary); }

    .biz-card {
        background:var(--bg-card); border-radius:var(--radius-xl); padding:32px;
        box-shadow:var(--shadow-lg); margin-bottom:20px; border:1px solid var(--border);
    }
    .biz-card h1 { font-size:1.4rem; color:var(--fg); margin-bottom:6px; }
    .biz-card h2 {
        font-size:0.85rem; color:var(--primary); margin:22px 0 12px; text-transform:uppercase;
        letter-spacing:0.05em; font-family:var(--font-mono);
    }
    .biz-card h2:first-of-type { margin-top:4px; }
    .biz-subtitle { color:var(--fg-muted); margin-bottom:22px; font-size:0.88rem; }

    .biz-card label { display:block; margin-bottom:6px; font-weight:600; color:var(--text); font-size:0.88rem; }
    .biz-card input, .biz-card textarea, .biz-card select {
        width:100%; padding:12px; border:1px solid var(--border); border-radius:var(--radius);
        font-size:0.92rem; margin-bottom:16px; outline:none; background:var(--bg-card);
        color:var(--fg); font-family:var(--font-body);
    }
    .biz-card input:focus, .biz-card textarea:focus, .biz-card select:focus { border-color:var(--primary); }
    .biz-errorlist { color:var(--danger); list-style:none; margin-bottom:10px; font-size:0.8rem; }

    .biz-checkbox-row { display:flex; align-items:center; gap:8px; margin-bottom:16px; }
    .biz-checkbox-row input { width:auto; margin:0; }
    .biz-checkbox-row.biz-delete-row label { color:var(--danger); }

    .biz-btn, .biz-card button {
        padding:13px 22px; border-radius:var(--radius); border:none; font-weight:700;
        font-size:0.9rem; cursor:pointer; text-decoration:none; display:inline-block; font-family:var(--font-body);
    }
    .biz-btn-primary { background:var(--primary); color:#fff; }
    .biz-btn-primary:hover { background:var(--primary-dark); }
    .biz-btn-ghost { background:transparent; color:var(--fg-muted); border:1px solid var(--border); }
    .biz-btn-ghost:hover { background:var(--muted); }
    .biz-form-actions { display:flex; justify-content:flex-end; gap:12px; margin-top:8px; }

    .biz-header {
        display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;
        background:linear-gradient(135deg, var(--fg) 0%, var(--primary) 60%, var(--secondary) 100%);
        border-radius:var(--radius-xl); padding:26px 30px; margin-bottom:22px; color:#fff;
        box-shadow:var(--shadow-lg);
    }
    .biz-header h1 { font-size:1.4rem; margin-bottom:8px; color:#fff; }
    .biz-badges { display:flex; gap:8px; flex-wrap:wrap; }
    .biz-badge { display:inline-block; padding:4px 12px; border-radius:var(--radius-full); font-size:0.72rem; font-weight:700; }
    .biz-badge-verified { background:var(--green-bg); color:var(--green-text); }
    .biz-badge-rejected { background:#FEE2E2; color:#991B1B; }
    .biz-badge-pending  { background:var(--gold-bg); color:#92400E; }
    .biz-badge-plan     { background:rgba(255,255,255,.18); color:#fff; }

    .biz-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:16px; margin-bottom:22px; }
    .biz-stat { background:var(--bg-card); border-radius:var(--radius-lg); padding:20px; box-shadow:var(--shadow); border:1px solid var(--border); }
    .biz-stat .biz-value { font-size:1.6rem; font-weight:700; color:var(--primary); font-family:var(--font-mono); }
    .biz-stat .biz-label { font-size:0.78rem; color:var(--fg-muted); margin-top:4px; }

    .biz-actions { display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:14px; margin-bottom:22px; }
    .biz-action-btn {
        display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
        background:var(--bg-card); border-radius:var(--radius-lg); padding:20px 12px; text-decoration:none;
        box-shadow:var(--shadow); border:1px solid var(--border);
        transition:var(--transition);
    }
    .biz-action-btn:hover { border-color:var(--primary); transform:translateY(-2px); }
    .biz-action-btn .biz-icon { font-size:22px; }
    .biz-action-btn .biz-action-label { font-size:0.8rem; font-weight:700; color:var(--fg); text-align:center; }
    .biz-action-btn.biz-primary { background:var(--primary); }
    .biz-action-btn.biz-primary .biz-action-label { color:#fff; }

    .biz-inquiry { padding:12px 0; border-bottom:1px solid var(--border); }
    .biz-inquiry:last-child { border-bottom:none; }
    .biz-empty { color:var(--fg-muted); font-size:0.85rem; }

    .biz-unlock { text-align:center; }
    .biz-unlock h2 { margin-bottom:8px; }

    .biz-product-box { border:1px solid var(--border); border-radius:var(--radius-lg); padding:20px; margin-bottom:16px; }

    .biz-plans-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:20px; }
    .biz-plan-card {
        background:var(--bg-card); border-radius:var(--radius-xl); padding:26px 22px;
        box-shadow:var(--shadow-lg); border:2px solid transparent; display:flex; flex-direction:column;
    }
    .biz-plan-card.biz-current { border-color:var(--primary); }
    .biz-plan-name { font-size:1.05rem; font-weight:700; color:var(--fg); margin-bottom:4px; }
    .biz-plan-price { font-size:1.5rem; font-weight:700; color:var(--primary); margin-bottom:2px; font-family:var(--font-mono); }
    .biz-plan-price small { font-size:0.75rem; font-weight:400; color:var(--fg-muted); }
    .biz-plan-yearly { font-size:0.72rem; color:var(--fg-muted); margin-bottom:16px; }
    .biz-plan-limits { list-style:none; margin-bottom:20px; flex-grow:1; }
    .biz-plan-limits li { font-size:0.78rem; color:var(--text); padding:6px 0; border-bottom:1px solid var(--border); }
    .biz-plan-limits li:last-child { border-bottom:none; }
    .biz-current-badge {
        display:inline-block; background:var(--green-bg); color:var(--green-text); font-size:0.72rem; font-weight:700;
        padding:4px 12px; border-radius:var(--radius-full); margin-bottom:14px; align-self:flex-start;
    }
</style>
